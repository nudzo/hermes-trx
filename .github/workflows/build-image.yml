name: Build and publish Hermes image

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  resolve-upstream-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.tags.outputs.matrix }}
      obscura_version: ${{ steps.obscura.outputs.release }}
    steps:
      - name: Resolve latest stable Obscura release
        id: obscura
        uses: pozetroninc/github-action-get-latest-release@2a61c339ea7ef0a336d1daa35ef0cb1418e7676c # v0.8.0 release
        with:
          repository: h4ckf0r0day/obscura
          excludes: prerelease, draft
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest and previous Hermes tags
        id: tags
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: 'NousResearch',
              repo: 'hermes-agent',
              per_page: 10,
            });

            const stableTags = releases
              .filter((release) => !release.draft && !release.prerelease)
              .map((release) => release.tag_name)
              .slice(0, 3);

            const include = [
              { upstream_tag: 'latest', image_tag: 'latest' },
              ...stableTags.map((tag) => ({ upstream_tag: tag, image_tag: tag })),
            ];

            core.info(`Publishing image tags: ${include.map((entry) => entry.image_tag).join(', ')}`);
            core.setOutput('matrix', JSON.stringify({ include }));

  build-and-push:
    runs-on: ubuntu-latest
    needs: resolve-upstream-tags
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-upstream-tags.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            HERMES_VERSION=${{ matrix.upstream_tag }}
            OBSCURA_VERSION=${{ needs.resolve-upstream-tags.outputs.obscura_version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.image_tag }}
