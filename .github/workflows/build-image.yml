name: Build and publish Hermes image

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.repository }}
  cancel-in-progress: false

jobs:
  resolve-upstream-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      build: ${{ steps.select.outputs.build }}
      obscura_version: ${{ steps.obscura.outputs.release }}
    steps:
      - name: Resolve latest stable Obscura release
        id: obscura
        uses: pozetroninc/github-action-get-latest-release@2a61c339ea7ef0a336d1daa35ef0cb1418e7676c # v0.8.0 release
        with:
          repository: h4ckf0r0day/obscura
          excludes: prerelease, draft
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest and previous Hermes tags
        id: tags
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: 'NousResearch',
              repo: 'hermes-agent',
              per_page: 10,
            });

            const stableTags = releases
              .filter((release) => !release.draft && !release.prerelease)
              .map((release) => release.tag_name)
              .slice(0, 3);

            core.setOutput('tags', JSON.stringify(['latest', ...stableTags]));

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scheduled runs rebuild a tag only when the upstream Hermes image digest differs from
      # the base digest recorded on our published image. Push and manual runs rebuild every tag.
      - name: Select tags to build
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAGS: ${{ steps.tags.outputs.tags }}
          BASE_IMAGE: docker.io/nousresearch/hermes-agent
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          include='[]'
          for tag in $(jq -r '.[]' <<<"$TAGS"); do
            if ! base_digest=$(docker buildx imagetools inspect "${BASE_IMAGE}:${tag}" --format '{{json .Manifest}}' | jq -re .digest); then
              echo "::warning::Upstream image ${BASE_IMAGE}:${tag} not found, skipping"
              continue
            fi
            built_digest=$(docker buildx imagetools inspect --raw "${IMAGE}:${tag}" 2>/dev/null \
              | jq -r '.annotations["org.opencontainers.image.base.digest"] // empty' || true)
            if [[ "$EVENT_NAME" == schedule && "$base_digest" == "$built_digest" ]]; then
              echo "${tag}: base ${base_digest} unchanged, skipping"
              continue
            fi
            echo "${tag}: base ${base_digest} (published: ${built_digest:-none}), building"
            include=$(jq -c --arg tag "$tag" --arg digest "$base_digest" \
              '. + [{upstream_tag: $tag, image_tag: $tag, base_digest: $digest}]' <<<"$include")
          done
          echo "matrix=$(jq -c '{include: .}' <<<"$include")" >> "$GITHUB_OUTPUT"
          echo "build=$(jq -r 'length > 0' <<<"$include")" >> "$GITHUB_OUTPUT"

  build-and-push:
    runs-on: ubuntu-latest
    needs: resolve-upstream-tags
    if: needs.resolve-upstream-tags.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-upstream-tags.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            HERMES_VERSION=${{ matrix.upstream_tag }}@${{ matrix.base_digest }}
            OBSCURA_VERSION=${{ needs.resolve-upstream-tags.outputs.obscura_version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.image_tag }}
          annotations: |
            index:org.opencontainers.image.base.name=docker.io/nousresearch/hermes-agent:${{ matrix.upstream_tag }}
            index:org.opencontainers.image.base.digest=${{ matrix.base_digest }}

  cleanup-untagged-images:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: write
    steps:
      - name: Delete obsolete untagged GHCR images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          delete-untagged: true
          validate: true
